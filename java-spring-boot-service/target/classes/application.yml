server:
  port: 8080
  address: 0.0.0.0
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ekyc_db}
    username: ${SPRING_DATASOURCE_USERNAME:ekyc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secure_password_123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  python-ai-url: ${PYTHON_AI_URL:http://localhost:8000/api/v1/ai/verify-ekyc}